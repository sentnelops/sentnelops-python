[project]
name = "sentnelops"
version = "0.2.0"
description = "Agent identity, lifecycle, and policy checks for AI agents — the SentnelOps Python SDK"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SentnelOps" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "PyJWT>=2.8"]
keywords = ["ai-agents", "mcp", "security", "governance", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://platform.sentnelops.com"
Documentation = "https://github.com/rrb11/sentnelops-python/tree/main/docs"
Source = "https://github.com/rrb11/sentnelops-python"

[project.scripts]
sentnelops = "sentnelops.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
